services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB saknas}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER saknas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY saknas}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY saknas}
      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL saknas}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD saknas}

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL saknas}
        VITE_IOT_ENABLED: "false"

    restart: unless-stopped

    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped

    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN saknas}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
